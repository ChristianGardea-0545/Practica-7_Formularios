<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con seleccion</title>
</head>

<body>

<h1>Formulario con seleccion</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre">
<!-- Crea un campo para escribir el nombre -->

<br>
<!-- Realiza un salto de linea -->

Selecciona tu pais:
<!-- Indica que se debe seleccionar un pais -->

<select name="pais">
<!-- Crea una lista desplegable -->

<option value="1">Argentina</option>
<!-- Agrega Argentina como opcion -->

<option value="2">España</option>
<!-- Agrega España como opcion -->

<option value="3">Mexico</option>
<!-- Agrega Mexico como opcion -->

<option value="4">Guatemala</option>
<!-- Agrega Guatemala como opcion -->

<option value="5">Honduras</option>
<!-- Agrega Honduras como opcion -->

<option value="6">El Salvador</option>
<!-- Agrega El Salvador como opcion -->

<option value="7">Venezuela</option>
<!-- Agrega Venezuela como opcion -->

<option value="8">Colombia</option>
<!-- Agrega Colombia como opcion -->

</select>
<!-- Cierra la lista desplegable -->

<br>
<!-- Realiza un salto de linea -->

<input type="submit" value="enviar">
<!-- Crea un boton para enviar los datos -->

<input type="reset" value="borrar">
<!-- Crea un boton para borrar los datos -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
