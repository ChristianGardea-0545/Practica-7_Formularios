<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con textarea</title>
</head>

<body>
	
<h1>Formulario con textarea</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre">
<!-- Crea un campo para escribir el nombre -->

<br>
<!-- Realiza un salto de linea -->

Ingresa tu correo:
<!-- Indica que se debe escribir el correo -->

<input type="email" name="correo">
<!-- Crea un campo para introducir un correo electronico -->

<br>
<!-- Realiza un salto de linea -->

Ingresa tus comentarios:
<!-- Indica que se deben escribir comentarios -->

<textarea name="comentarios" rows="1" cols="10"></textarea>
<!-- Crea un area para escribir varias lineas de texto -->

<br>
<!-- Realiza un salto de linea -->

<input type="submit" value="enviar">
<!-- Crea un boton para enviar los datos -->

<input type="reset" value="borrar">
<!-- Crea un boton para borrar los datos -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
