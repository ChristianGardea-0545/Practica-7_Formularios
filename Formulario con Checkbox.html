<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con checkbox</title>
</head>

<body>

<h1>Formulario con checkbox</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre">
<!-- Crea un campo para escribir el nombre -->

<br>
<!-- Realiza un salto de linea -->

Selecciona los lenguajes que conozcas:
<!-- Indica que se deben seleccionar los lenguajes conocidos -->

<br>
<!-- Realiza un salto de linea -->

<input type="checkbox" name="Java"> Java
<!-- Crea una casilla para seleccionar Java -->

<br>
<!-- Realiza un salto de linea -->

<input type="checkbox" name="Python"> Python
<!-- Crea una casilla para seleccionar Python -->

<br>
<!-- Realiza un salto de linea -->

<input type="checkbox" name="C#"> C#
<!-- Crea una casilla para seleccionar C# -->

<br>
<!-- Realiza un salto de linea -->

<input type="checkbox" name="Flutter"> Flutter
<!-- Crea una casilla para seleccionar Flutter -->

<br>
<!-- Realiza un salto de linea -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
