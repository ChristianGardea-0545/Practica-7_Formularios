<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con radiobutton</title>
</head>

<body>

<h1>Formulario con radiobutton</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre">
<!-- Crea un campo para escribir el nombre -->

<br>
<!-- Realiza un salto de linea -->

Selecciona el maximo de estudios que tienes:
<!-- Indica que se debe seleccionar un nivel de estudios -->

<br>
<!-- Realiza un salto de linea -->

<input type="radio" name="estudios" value="1"> Sin estudios
<!-- Crea una opcion de tipo radio para seleccionar sin estudios -->

<br>
<!-- Realiza un salto de linea -->

<input type="radio" name="estudios" value="2"> Primaria
<!-- Crea una opcion de tipo radio para seleccionar primaria -->

<br>
<!-- Realiza un salto de linea -->

<input type="radio" name="estudios" value="3"> Secundaria
<!-- Crea una opcion de tipo radio para seleccionar secundaria -->

<br>
<!-- Realiza un salto de linea -->

<input type="radio" name="estudios" value="4"> Preparatoria
<!-- Crea una opcion de tipo radio para seleccionar preparatoria -->

<br>
<!-- Realiza un salto de linea -->

<input type="submit" value="enviar">
<!-- Crea un boton para enviar los datos -->

<input type="reset" value="borrar">
<!-- Crea un boton para borrar los datos -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
