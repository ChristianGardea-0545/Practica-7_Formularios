<body>

<h1>Formulario para contraseñas</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

Ingresa tu usuario:
<!-- Indica que se debe escribir el usuario -->

<input type="text" name="usuario">
<!-- Crea un campo para escribir el usuario -->

Ingresa tu contraseña:
<!-- Indica que se debe escribir la contraseña -->

<input type="password" name="pass">
<!-- Crea un campo donde la contraseña aparece oculta -->

<br>
<!-- Realiza un salto de linea -->

<input type="submit" value="enviar">
<!-- Crea un boton para enviar los datos -->

<input type="reset" value="borrar">
<!-- Crea un boton para borrar los datos introducidos -->

</form>
<!-- Cierra el formulario -->

</body>
