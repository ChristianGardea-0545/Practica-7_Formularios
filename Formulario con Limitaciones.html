<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con limitaciones</title>
</head>
<body>

<h1>Formulario con limitaciones</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

<!-- Deshabilitacion de campo -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre" disabled>
<!-- Crea un campo de texto que esta deshabilitado -->

<br>
<!-- Realiza un salto de linea -->

<!-- Limitacion de caracteres -->

Contraseña:
<!-- Indica que se debe escribir una contraseña -->

<input type="password" name="pass" maxlength="5">
<!-- Crea un campo de contraseña con un limite de 5 caracteres -->

<br>
<!-- Realiza un salto de linea -->

<!-- Solo lectura -->

Comentarios:
<!-- Indica que se pueden consultar los comentarios -->

<textarea name="comentarios" readonly>
Este es mi comentario y no se puede borrar
</textarea>
<!-- Crea un area de texto que solo permite leer el contenido -->

<br>
<!-- Realiza un salto de linea -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
