<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulario con campos ocultos</title>

<!-- Libreria de iconos en linea -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css">
<!-- Permite utilizar iconos de Font Awesome -->

</head>

<body>

<h1>Formulario con campos ocultos</h1>
<!-- Muestra el titulo principal -->

<form action="" method="post">
<!-- Inicia el formulario -->

<input type="hidden" name="hora" value="3:30">
<!-- Guarda un dato oculto que no se muestra en la pagina -->

Ingresa tu nombre:
<!-- Indica que se debe escribir el nombre -->

<input type="text" name="nombre">
<!-- Crea un campo para escribir el nombre -->

<br>
<!-- Realiza un salto de linea -->

<button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button>
<!-- Crea un boton para enviar el formulario -->

<button type="reset">Borrar <i class="fa fa-trash"></i></button>
<!-- Crea un boton para borrar los datos -->

</form>
<!-- Cierra el formulario -->

</body>
</html>
